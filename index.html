<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget App</title>
  <!-- CDNs for React, Babel, Tailwind, Lucide Icons, Recharts, XLSX -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const { 
      Wallet, Landmark, Coins, PieChart, Receipt, Plus, Trash2, Download, Printer, 
      Search, TrendingUp, TrendingDown, CalendarDays, Menu, X, ChevronsRight, ChevronsLeft 
    } = lucideReact || {};

    const { 
      BarChart, Bar, LineChart, Line, PieChart: RePie, Pie, Cell, XAxis, YAxis, 
      CartesianGrid, Tooltip, Legend, ResponsiveContainer 
    } = Recharts || {};

    /* --- App Logic --- */
    const useLedgerFonts = () => {
      useEffect(() => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap';
        document.head.appendChild(link);
        return () => document.head.removeChild(link);
      }, []);
    };

    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
    const fmt = (v) => "৳ " + new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(num(v));

    function App() {
      useLedgerFonts();
      return (
        <div class="p-6 text-center">
          <h1 class="text-2xl font-bold text-emerald-400">আপনার বাজেট অ্যাপ প্রস্তুত!</h1>
          <p class="mt-2 text-slate-300">এখন সম্পূর্ণ ডাটা সেটআপ করে এটি ব্যবহার করতে পারবেন।</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
