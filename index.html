/* ---------------------------------------------------------------------- */
/*  Local storage shim (replaces the Claude-artifact window.storage API)   */
/* ---------------------------------------------------------------------- */
const STORAGE_PREFIX = "finance-app:";
const storage = {
  async get(key) {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
      return raw === null ? null : { key, value: raw };
    } catch (e) {
      console.error("localStorage read failed:", e);
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(STORAGE_PREFIX + key, value);
      return { key, value };
    } catch (e) {
      console.error("localStorage write failed:", e);
      return null;
    }
  },
};

/* ---------------------------------------------------------------------- */
/*  Fonts                                                                  */
/* ---------------------------------------------------------------------- */
function useLedgerFonts() {
  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
    document.head.appendChild(link);
    return () => document.head.removeChild(link);
  }, []);
}

/* ---------------------------------------------------------------------- */
/*  Constants / helpers                                                    */
/* ---------------------------------------------------------------------- */
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = (v) => "৳ " + new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(num(v));
const monthKey = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
const todayISO = () => new Date().toISOString().slice(0, 10);

const COLOR = { green: "#4f9a67", yellow: "#cf9a3c", red: "#c0392b", neutral: "#7d8f86", gold: "#c9a227" };

const DEFAULT_ASSETS = ["Gold","Eid ul Adha Fund","Bkash","Cash","Receivables","DPS","FDR","Sanchaypatra","Tangible Assets"];
const DEFAULT_INCOME = ["Salary","Incentives"];
const DEFAULT_EXPENSE = [
  "Home Rent","Family Budget - Abbu","Family Budget - Ammu","Family Budget - Hena","Family Budget - Jannat",
  "Hand Cost","Home Cost","Electricity","Hair","Internet and Mobile","Home Maid","Shariatpur","Doctor","EMI",
  "DPS","Kurbani","Tour","Shopping","Loan EMI","Other Dues","Other"
];

function emptyMonth() {
  return {
    income: DEFAULT_INCOME.map((h) => ({ id: uid(), head: h, budget: 0, actual: 0, notes: "" })),
    expense: DEFAULT_EXPENSE.map((h) => ({ id: uid(), head: h, budget: 0, actual: 0, notes: "" })),
  };
}

function defaultState() {
  return {
    assets: DEFAULT_ASSETS.map((n) => ({ id: uid(), name: n, amount: 0 })),
    liabilities: { borrowings: [], cards: [], loans: [], custom: [] },
    months: {},
    handCostCycles: {},
    visitBills: [],
  };
}

/* Hand Cost cycle: 24th of `cycleKey` month -> 23rd of the next month */
function cycleDates(cycleKey) {
  const [y, m] = cycleKey.split("-").map(Number);
  const start = new Date(y, m - 1, 24);
  const dates = [];
  for (let i = 0; i < 31; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    dates.push(d.toISOString().slice(0, 10));
    const next = new Date(y, m, 23);
    if (d.getFullYear() === next.getFullYear() && d.getMonth() === next.getMonth() && d.getDate() === next.getDate()) break;
  }
  return dates;
}
function cycleLabel(cycleKey) {
  const [y, m] = cycleKey.split("-").map(Number);
  const startM = MONTH_NAMES[m - 1].slice(0, 3);
  const endDate = new Date(y, m, 23);
  const endM = MONTH_NAMES[endDate.getMonth()].slice(0, 3);
  return `24 ${startM} – 23 ${endM} ${endDate.getFullYear()}`;
}

/* Budget usage status: green <50%, yellow 50-90%, red >=90% or exceeded */
function usageStatus(budget, actual) {
  const b = num(budget), a = num(actual);
  if (b <= 0 && a <= 0) return { color: COLOR.neutral, label: null };
  if (a > b && b > 0) return { color: COLOR.red, label: "Exceeded" };
  if (b <= 0) return { color: COLOR.red, label: "No budget" };
  const pct = (a / b) * 100;
  if (pct >= 90) return { color: COLOR.red, label: "Critical" };
  if (pct >= 50) return { color: COLOR.yellow, label: "Moderate" };
  return { color: COLOR.green, label: "Low" };
}

/* Net position status: healthy / attention / critical */
function netPositionStatus(assets, liabilities) {
  const net = assets - liabilities;
  if (net <= 0) return { color: COLOR.red, label: "Critical" };
  if (liabilities <= 0 || assets >= liabilities * 1.5) return { color: COLOR.green, label: "Healthy" };
  return { color: COLOR.yellow, label: "Attention" };
}

/*  Small UI atoms                                                         */

function Card({ children, className = "" }) {

}

function StatCard({ label, value, tone = "neutral", icon: Icon, statusColor, statusLabel }) {
  const toneColor =
    tone === "good" ? "text-[#c9a227]" : tone === "bad" ? "text-[#c0392b]" : "text-[#e9e4d8]";
  return (
    <Card className="p-4 flex flex-col gap-1 min-w-[150px]" >
      <div style={statusColor ? { borderLeft: `3px solid ${statusColor}`, marginLeft: "-1px", paddingLeft: 10 } : {}}>

          {Icon ? <Icon size={14} className="text-[#4f6158]" /> : null}

        <div className="flex items-center gap-2 flex-wrap">

          {statusLabel && (
            <span className="text-[10px] font-medium px-1.5 py-0.5 rounded" style={{ color: statusColor, backgroundColor: statusColor + "22" }}>
              {statusLabel}

      </div>

  );
}

}

}

function GhostBtn({ onClick, children, className = "" }) {

function Select({ value, onChange, options, className = "" }) {

/* ---------------------------------------------------------------------- */
/*  Generic editable table — wide, wrapping-friendly columns               */
/* ---------------------------------------------------------------------- */
function EditableTable({ columns, rows, onChange, onAdd, onDelete, addLabel = "Add row", totals, readOnlyKeys = {}, statusFn }) {
  const update = (id, key, value) => {
    onChange(rows.map((r) => (r.id === id ? { ...r, [key]: value } : r)));
  };
  return (
    <div className="overflow-x-auto -mx-1 px-1">
      <table className="w-full text-sm border-collapse" style={{ minWidth: Math.max(560, columns.length * 150) }}>
        <thead>
          <tr className="text-left text-[11px] uppercase tracking-wider text-[#7d8f86] border-b border-[#26332e]">
            {columns.map((c) => (
              <th key={c.key} className="py-2 pr-3 font-medium align-bottom" style={{ minWidth: c.minWidth || 130 }}>{c.label}</th>
            ))}
            <th className="py-2 w-9"></th>
          </tr>
        </thead>
        <tbody>
          {rows.map((row) => {
            const status = statusFn ? statusFn(row) : null;
            return (
            <tr key={row.id} className="border-b border-[#1c2622] hover:bg-[#131b18]" style={status ? { borderLeft: `3px solid ${status.color}` } : {}}>
              {columns.map((c) => {
                const ro = typeof readOnlyKeys[row.id] !== "undefined" && readOnlyKeys[row.id].includes(c.key);
                return (
                  <td key={c.key} className="py-2 pr-3 align-top" style={{ minWidth: c.minWidth || 130 }}>
                    {ro ? (
                      <span className="font-mono text-[#c9a227] text-sm px-1 whitespace-normal break-words">{fmt(row[c.key])} <span className="text-[10px] text-[#7d8f86]">(synced)</span></span>
                    ) : c.type === "number" ? (
                      <input
                        type="number"
                        value={row[c.key]}
                        onChange={(e) => update(row.id, c.key, e.target.value === "" ? "" : num(e.target.value))}
                        className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm font-mono text-[#e9e4d8] focus:outline-none focus:border-[#c9a227] w-full min-w-[110px]"
                      />
                    ) : c.type === "date" ? (
                      <input
                        type="date"
                        value={row[c.key] || ""}
                        onChange={(e) => update(row.id, c.key, e.target.value)}
                        className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm text-[#e9e4d8] focus:outline-none focus:border-[#c9a227] w-full min-w-[140px]"
                      />
                    ) : c.type === "computed" ? (
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className={`font-mono text-sm whitespace-normal break-words`} style={{ color: c.colorize ? c.colorize(row).color : (c.compute(row) < 0 ? COLOR.red : "#7fae72") }}>
                          {fmt(c.compute(row))}
                        </span>
                        {c.colorize && c.colorize(row).label && (
                          <span className="text-[10px] font-medium px-1.5 py-0.5 rounded shrink-0" style={{ color: c.colorize(row).color, backgroundColor: c.colorize(row).color + "22" }}>
                            {c.colorize(row).label}
                          </span>
                        )}
                      </div>
                    ) : (
                      <textarea
                        rows={1}
                        value={row[c.key]}
                        onChange={(e) => update(row.id, c.key, e.target.value)}
                        className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm text-[#e9e4d8] focus:outline-none focus:border-[#c9a227] w-full min-w-[130px] resize-y leading-snug"
                      />
                    )}
                  </td>
                );
              })}
              <td className="py-2 align-top">
                <IconBtn danger title="Delete" onClick={() => onDelete(row.id)}><Trash2 size={14} /></IconBtn>
              </td>
            </tr>
          );})}
          {totals && (
            <tr className="border-t-2 border-[#26332e] font-mono text-sm">
              {columns.map((c, i) => (
                <td key={c.key} className="py-2.5 pr-3 text-[#c9a227] font-semibold">
                  {i === 0 ? "Total" : totals[c.key] !== undefined ? fmt(totals[c.key]) : ""}
                </td>
              ))}
              <td></td>
            </tr>
          )}
        </tbody>
      </table>
      {onAdd && (
        <button onClick={onAdd} className="mt-3 inline-flex items-center gap-1 text-xs text-[#c9a227] hover:text-[#dab538]">
          <Plus size={13} /> {addLabel}
        </button>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Balance Sheet Tab                                                      */
/* ---------------------------------------------------------------------- */
function LiabilitiesOverview({ borrowTotal, cardTotal, loanTotal, custom, setCustom, totalLiabilities }) {
  return (
    <div className="overflow-x-auto -mx-1 px-1">
      <table className="w-full text-sm border-collapse" style={{ minWidth: 480 }}>
        <thead>
          <tr className="text-left text-[11px] uppercase tracking-wider text-[#7d8f86] border-b border-[#26332e]">
            <th className="py-2 pr-3 font-medium" style={{ minWidth: 220 }}>Liability Head</th>
            <th className="py-2 pr-3 font-medium" style={{ minWidth: 160 }}>Amount</th>
            <th className="py-2 w-9"></th>
          </tr>
        </thead>
        <tbody>
          <tr className="border-b border-[#1c2622]">
            <td className="py-2 pr-3">Hand Borrowings</td>
            <td className="py-2 pr-3 font-mono text-[#c9a227]">{fmt(borrowTotal)} <span className="text-[10px] text-[#7d8f86]">(synced below)</span></td>
            <td></td>
          </tr>
          <tr className="border-b border-[#1c2622]">
            <td className="py-2 pr-3">Card Bill</td>
            <td className="py-2 pr-3 font-mono text-[#c9a227]">{fmt(cardTotal)} <span className="text-[10px] text-[#7d8f86]">(synced below)</span></td>
            <td></td>
          </tr>
          <tr className="border-b border-[#1c2622]">
            <td className="py-2 pr-3">Bank Loan</td>
            <td className="py-2 pr-3 font-mono text-[#c9a227]">{fmt(loanTotal)} <span className="text-[10px] text-[#7d8f86]">(synced below)</span></td>
            <td></td>
          </tr>
          {custom.map((row) => (
            <tr key={row.id} className="border-b border-[#1c2622] hover:bg-[#131b18]">
              <td className="py-2 pr-3">
                <textarea rows={1} value={row.name} onChange={(e) => setCustom(custom.map((r) => r.id === row.id ? { ...r, name: e.target.value } : r))}
                  className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm text-[#e9e4d8] focus:outline-none focus:border-[#c9a227] w-full min-w-[180px] resize-y" />
              </td>
              <td className="py-2 pr-3">
                <input type="number" value={row.amount} onChange={(e) => setCustom(custom.map((r) => r.id === row.id ? { ...r, amount: e.target.value === "" ? "" : num(e.target.value) } : r))}
                  className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm font-mono text-[#e9e4d8] focus:outline-none focus:border-[#c9a227] w-full min-w-[110px]" />
              </td>
              <td className="py-2"><IconBtn danger title="Delete" onClick={() => setCustom(custom.filter((r) => r.id !== row.id))}><Trash2 size={14} /></IconBtn></td>
            </tr>
          ))}
          <tr className="border-t-2 border-[#26332e] font-mono text-sm">
            <td className="py-2.5 pr-3 text-[#c9a227] font-semibold">Total Liabilities</td>
            <td className="py-2.5 pr-3 text-[#c9a227] font-semibold">{fmt(totalLiabilities)}</td>
            <td></td>
          </tr>
        </tbody>
      </table>
      <button onClick={() => setCustom([...custom, { id: uid(), name: "New Liability", amount: 0 }])} className="mt-3 inline-flex items-center gap-1 text-xs text-[#c9a227] hover:text-[#dab538]">
        <Plus size={13} /> Add New Liability
      </button>
    </div>
  );
}

function BalanceSheetTab({ state, setState }) {
  const totalAssets = state.assets.reduce((s, a) => s + num(a.amount), 0);
  const borrowTotal = state.liabilities.borrowings.reduce((s, r) => s + num(r.amount), 0);
  const cardTotal = state.liabilities.cards.reduce((s, r) => s + num(r.outstanding), 0);
  const loanTotal = state.liabilities.loans.reduce((s, r) => s + num(r.outstanding), 0);
  const customTotal = (state.liabilities.custom || []).reduce((s, r) => s + num(r.amount), 0);
  const totalLiabilities = borrowTotal + cardTotal + loanTotal + customTotal;
  const netPosition = totalAssets - totalLiabilities;
  const status = netPositionStatus(totalAssets, totalLiabilities);

  const setAssets = (rows) => setState((s) => ({ ...s, assets: rows }));
  const setBorrow = (rows) => setState((s) => ({ ...s, liabilities: { ...s.liabilities, borrowings: rows } }));
  const setCards = (rows) => setState((s) => ({ ...s, liabilities: { ...s.liabilities, cards: rows } }));
  const setLoans = (rows) => setState((s) => ({ ...s, liabilities: { ...s.liabilities, loans: rows } }));
  const setCustom = (rows) => setState((s) => ({ ...s, liabilities: { ...s.liabilities, custom: rows } }));

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <StatCard label="Total Assets" value={totalAssets} tone="good" icon={Coins} />
        <StatCard label="Total Liabilities" value={totalLiabilities} tone="bad" icon={Landmark} />
        <StatCard label="Net Position" value={netPosition} tone={netPosition >= 0 ? "good" : "bad"} icon={Wallet} statusColor={status.color} statusLabel={status.label} />
      </div>

      <Card className="p-4">
        <SectionTitle sub="Everything you own">ASSETS</SectionTitle>
        <EditableTable
          columns={[
            { key: "name", label: "Asset Head", type: "text", minWidth: 220 },
            { key: "amount", label: "Amount (TK)", type: "number", minWidth: 150 },
          ]}
          rows={state.assets}
          onChange={setAssets}
          onAdd={() => setAssets([...state.assets, { id: uid(), name: "New Asset", amount: 0 }])}
          onDelete={(id) => setAssets(state.assets.filter((r) => r.id !== id))}
          addLabel="Add New Asset"
          totals={{ amount: totalAssets }}
        />
      </Card>

      <Card className="p-4">
        <SectionTitle sub="Owed amounts, at a glance">LIABILITIES</SectionTitle>
        <LiabilitiesOverview borrowTotal={borrowTotal} cardTotal={cardTotal} loanTotal={loanTotal} custom={state.liabilities.custom || []} setCustom={setCustom} totalLiabilities={totalLiabilities} />
      </Card>

      <Card className="p-4">
        <SectionTitle sub="Person-wise hand borrowings">Hand Borrowings</SectionTitle>
        <EditableTable
          columns={[
            { key: "person", label: "Person Name", type: "text", minWidth: 180 },
            { key: "amount", label: "Amount (TK)", type: "number", minWidth: 130 },
            { key: "date", label: "Date", type: "date", minWidth: 150 },
            { key: "notes", label: "Notes", type: "text", minWidth: 220 },
          ]}
          rows={state.liabilities.borrowings}
          onChange={setBorrow}
          onAdd={() => setBorrow([...state.liabilities.borrowings, { id: uid(), person: "", amount: 0, date: todayISO(), notes: "" }])}

/* ---------------------------------------------------------------------- */
/*  Monthly Budget Tab                                                     */
/* ---------------------------------------------------------------------- */
function MonthlyBudgetTab({ state, setState, year, month, setYear, setMonth }) {
  const key = monthKey(year, month);
  const data = state.months[key] || emptyMonth();

  const ensure = useCallback((fn) => {
    setState((s) => {
      const cur = s.months[key] || emptyMonth();
      return { ...s, months: { ...s.months, [key]: fn(cur) } };
    });
  }, [key, setState]);

  const cycleTotalsForMonth = useMemo(() => {
    const cyc = state.handCostCycles[key];
    if (!cyc) return null;
    const dates = cycleDates(key);
    let officeA = 0, handA = 0;
    dates.forEach((d) => {
      const e = cyc.daily?.[d];
      if (e) { officeA += num(e.officeActual); handA += num(e.handActual); }
    });
    return officeA + handA;
  }, [state.handCostCycles, key]);

  const income = data.income.map((r) => ({ ...r }));
  const expense = data.expense.map((r) => {
    if (r.head === "Hand Cost" && cycleTotalsForMonth !== null) {
      return { ...r, actual: cycleTotalsForMonth };
    }
    return { ...r };
  });

  const totalIncomeBudget = income.reduce((s, r) => s + num(r.budget), 0);
  const totalIncomeActual = income.reduce((s, r) => s + num(r.actual), 0);
  const totalExpenseBudget = expense.reduce((s, r) => s + num(r.budget), 0);
  const totalExpenseActual = expense.reduce((s, r) => s + num(r.actual), 0);
  const surplus = totalIncomeActual - totalExpenseActual;
  const overallStatus = usageStatus(totalExpenseBudget, totalExpenseActual);

  const readOnly = {};
  expense.forEach((r) => { if (r.head === "Hand Cost" && cycleTotalsForMonth !== null) readOnly[r.id] = ["actual"]; });

  const years = Array.from({ length: 9 }, (_, i) => 2023 + i);

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-end gap-3">
        <div>
          <label className="block text-[11px] uppercase tracking-wider text-[#7d8f86] mb-1">Year</label>
          <Select value={year} onChange={(e) => setYear(Number(e.target.value))} options={years.map((y) => ({ value: y, label: y }))} />
        </div>
        <div>
          <label className="block text-[11px] uppercase tracking-wider text-[#7d8f86] mb-1">Month</label>
          <Select value={month} onChange={(e) => setMonth(Number(e.target.value))} options={MONTH_NAMES.map((m, i) => ({ value: i + 1, label: m }))} />
        </div>
        <span className="text-xs text-[#7d8f86] pb-2">Editing sheet: <span className="text-[#c9a227] font-mono">{MONTH_NAMES[month - 1]} {year}</span></span>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <StatCard label="Actual Income" value={totalIncomeActual} tone="good" icon={TrendingUp} />
        <StatCard label="Actual Expense" value={totalExpenseActual} tone="bad" icon={TrendingDown} statusColor={overallStatus.color} statusLabel={overallStatus.label} />
        <StatCard label="Surplus / Deficit" value={surplus} tone={surplus >= 0 ? "good" : "bad"} icon={Wallet} />
      </div>

      <Card className="p-4">
        <SectionTitle sub="Budgeted vs actual income for this month">Income</SectionTitle>
        <EditableTable
          columns={[
            { key: "head", label: "Income Head", type: "text", minWidth: 190 },
            { key: "budget", label: "Budgeted", type: "number", minWidth: 130 },
            { key: "actual", label: "Actual", type: "number", minWidth: 130 },
            { key: "diff", label: "Difference", type: "computed", compute: (r) => num(r.actual) - num(r.budget), minWidth: 130 },
            { key: "notes", label: "Notes", type: "text", minWidth: 220 },
          ]}
          rows={income}
          onChange={(rows) => ensure((cur) => ({ ...cur, income: rows }))}
          onAdd={() => ensure((cur) => ({ ...cur, income: [...cur.income, { id: uid(), head: "New Income", budget: 0, actual: 0, notes: "" }] }))}
          onDelete={(id) => ensure((cur) => ({ ...cur, income: cur.income.filter((r) => r.id !== id) }))}
          addLabel="Add new income field"
          totals={{ budget: totalIncomeBudget, actual: totalIncomeActual }}
        />
      </Card>

      <Card className="p-4">
        <SectionTitle sub="Budgeted vs actual expense — colored by budget usage">Expense</SectionTitle>
        <EditableTable
          columns={[
            { key: "head", label: "Expense Head", type: "text", minWidth: 210 },
            { key: "budget", label: "Budget", type: "number", minWidth: 130 },
            { key: "actual", label: "Actual Cost", type: "number", minWidth: 130 },
            { key: "remaining", label: "Remaining", type: "computed", compute: (r) => num(r.budget) - num(r.actual), colorize: (r) => usageStatus(r.budget, r.actual), minWidth: 160 },
            { key: "notes", label: "Notes", type: "text", minWidth: 220 },
          ]}
          rows={expense}
          onChange={(rows) => ensure((cur) => ({ ...cur, expense: rows.map((r) => {
            if (r.head === "Hand Cost" && cycleTotalsForMonth !== null) return { ...r, actual: cur.expense.find(x=>x.id===r.id)?.actual ?? r.actual };
            return r;
          }) }))}
          onAdd={() => ensure((cur) => ({ ...cur, expense: [...cur.expense, { id: uid(), head: "New Expense", budget: 0, actual: 0, notes: "" }] }))}
          onDelete={(id) => ensure((cur) => ({ ...cur, expense: cur.expense.filter((r) => r.id !== id) }))}
          addLabel="Add new expense field"
          totals={{ budget: totalExpenseBudget, actual: totalExpenseActual }}
          readOnlyKeys={readOnly}
        />
        <div className="flex items-center gap-4 mt-3 text-[11px] text-[#7d8f86]">
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{ background: COLOR.green }}></span> Below 50% used</span>
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{ background: COLOR.yellow }}></span> 50–90% used</span>
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{ background: COLOR.red }}></span> 90%+ or exceeded</span>
        </div>
        {cycleTotalsForMonth !== null && (
          <p className="text-[11px] text-[#7d8f86] mt-2">Hand Cost actual is synced automatically from the Hand Cost Budget tab for this month's cycle.</p>
        )}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Hand Cost Tab                                                          */
/* ---------------------------------------------------------------------- */
function HandCostTab({ state, setState, cycleKey, setCycleKey }) {
  const dates = cycleDates(cycleKey);
  const cyc = state.handCostCycles[cycleKey] || { daily: {} };

  const updateDay = (date, field, value) => {
    setState((s) => {
      const c = s.handCostCycles[cycleKey] || { daily: {} };
      const day = c.daily[date] || { officeBudget: 0, handBudget: 0, officeActual: 0, handActual: 0 };
      const newDay = { ...day, [field]: value };
      return {
        ...s,
        handCostCycles: {
          ...s.handCostCycles,
          [cycleKey]: { ...c, daily: { ...c.daily, [date]: newDay } },
        },
      };
    });
  };

  let totOfficeB = 0, totHandB = 0, totOfficeA = 0, totHandA = 0;
  dates.forEach((d) => {
    const e = cyc.daily[d];
    if (e) { totOfficeB += num(e.officeBudget); totHandB += num(e.handBudget); totOfficeA += num(e.officeActual); totHandA += num(e.handActual); }
  });
  const totBudget = totOfficeB + totHandB;
  const totActual = totOfficeA + totHandA;
  const cycleStatus = usageStatus(totBudget, totActual);

  const years = Array.from({ length: 9 }, (_, i) => 2023 + i);
  const [cy, cm] = cycleKey.split("-").map(Number);

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-end gap-3">
        <div>
          <label className="block text-[11px] uppercase tracking-wider text-[#7d8f86] mb-1">Cycle start year</label>
          <Select value={cy} onChange={(e) => setCycleKey(monthKey(Number(e.target.value), cm))} options={years.map((y) => ({ value: y, label: y }))} />
        </div>
        <div>
          <label className="block text-[11px] uppercase tracking-wider text-[#7d8f86] mb-1">Cycle start month (24th)</label>
          <Select value={cm} onChange={(e) => setCycleKey(monthKey(cy, Number(e.target.value)))} options={MONTH_NAMES.map((m, i) => ({ value: i + 1, label: m }))} />
        </div>
        <span className="text-xs text-[#7d8f86] pb-2">Cycle: <span className="text-[#c9a227] font-mono">{cycleLabel(cycleKey)}</span></span>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <StatCard label="Office Budget" value={totOfficeB} />
        <StatCard label="Office Actual" value={totOfficeA} tone="bad" />
        <StatCard label="Hand Budget" value={totHandB} />
        <StatCard label="Hand Actual" value={totHandA} tone="bad" />
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <StatCard label="Combined Budget" value={totBudget} />
        <StatCard label="Combined Actual" value={totActual} tone="bad" statusColor={cycleStatus.color} statusLabel={cycleStatus.label} />
        <StatCard label="Remaining" value={totBudget - totActual} tone={totBudget - totActual >= 0 ? "good" : "bad"} />
      </div>

      <Card className="p-4">
        <SectionTitle sub="24th → 23rd cycle · daily office &amp; hand cost, colored by usage">Daily Hand Cost</SectionTitle>
        <div className="overflow-x-auto -mx-1 px-1">
          <table className="w-full text-sm border-collapse" style={{ minWidth: 780 }}>
            <thead>
              <tr className="text-left text-[11px] uppercase tracking-wider text-[#7d8f86] border-b border-[#26332e]">
                <th className="py-2 pr-3" style={{ minWidth: 130 }}>Date</th>
                <th className="py-2 pr-3" style={{ minWidth: 130 }}>Office Budget</th>
                <th className="py-2 pr-3" style={{ minWidth: 130 }}>Hand Budget</th>
                <th className="py-2 pr-3" style={{ minWidth: 130 }}>Office Actual</th>
                <th className="py-2 pr-3" style={{ minWidth: 130 }}>Hand Actual</th>
                <th className="py-2 pr-3" style={{ minWidth: 150 }}>Remaining</th>
              </tr>
            </thead>
            <tbody>
              {dates.map((d) => {
                const e = cyc.daily[d] || { officeBudget: 0, handBudget: 0, officeActual: 0, handActual: 0 };
                const dayBudget = num(e.officeBudget) + num(e.handBudget);
                const dayActual = num(e.officeActual) + num(e.handActual);
                const remaining = dayBudget - dayActual;
                const st = usageStatus(dayBudget, dayActual);
                return (
                  <tr key={d} className="border-b border-[#1c2622] hover:bg-[#131b18]" style={{ borderLeft: `3px solid ${st.color}` }}>
                    <td className="py-2 pr-3 font-mono text-xs text-[#9fb0a7]">{d}</td>
                    {["officeBudget", "handBudget", "officeActual", "handActual"].map((f) => (
                      <td key={f} className="py-2 pr-3">
                        <input type="number" value={e[f]} onChange={(ev) => updateDay(d, f, ev.target.value === "" ? "" : num(ev.target.value))}
                          className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm font-mono text-[#e9e4d8] focus:outline-none focus:border-[#c9a227] w-full min-w-[100px]" />
                      </td>
                    ))}
                    <td className="py-2 pr-3">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="font-mono text-sm" style={{ color: st.color }}>{fmt(remaining)}</span>
                        {st.label && <span className="text-[10px] font-medium px-1.5 py-0.5 rounded shrink-0" style={{ color: st.color, backgroundColor: st.color + "22" }}>{st.label}</span>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Visit Bill Tab (independent)                                           */
/* ---------------------------------------------------------------------- */
function VisitBillTab({ state, setState }) {
  const [q, setQ] = useState("");
  const [branch, setBranch] = useState("");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");

  const setBills = (rows) => setState((s) => ({ ...s, visitBills: rows }));

  const filtered = state.visitBills.filter((v) => {
    if (q && !v.client.toLowerCase().includes(q.toLowerCase())) return false;
    if (branch && v.branch !== branch) return false;
    if (from && v.date < from) return false;
    if (to && v.date > to) return false;
    return true;
  }).sort((a, b) => (a.date < b.date ? 1 : -1));

  const branches = Array.from(new Set(state.visitBills.map((v) => v.branch).filter(Boolean)));

  const totalVisits = filtered.length;
  const totalAmount = filtered.reduce((s, r) => s + num(r.visitAmount), 0);
  const totalActual = filtered.reduce((s, r) => s + num(r.actualCost), 0);
  const totalRemaining = totalAmount - totalActual;

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <StatCard label="Total Visits" value={totalVisits} />
        <StatCard label="Visit Amount" value={totalAmount} />
        <StatCard label="Actual Cost" value={totalActual} tone="bad" />
        <StatCard label="Remaining" value={totalRemaining} tone={totalRemaining >= 0 ? "good" : "bad"} />
      </div>

      <Card className="p-4">
        <div className="flex flex-wrap gap-2 mb-4">
          <div className="relative flex-1 min-w-[180px]">
            <Search size={14} className="absolute left-2 top-2.5 text-[#7d8f86]" />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search client…"
              className="bg-[#0f1513] border border-[#26332e] rounded-md pl-7 pr-2 py-1.5 text-sm text-[#e9e4d8] w-full focus:outline-none focus:border-[#c9a227]" />
          </div>
          <Select value={branch} onChange={(e) => setBranch(e.target.value)} options={[{ value: "", label: "All Branches" }, ...branches.map((b) => ({ value: b, label: b }))]} />
          <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm text-[#e9e4d8] focus:outline-none focus:border-[#c9a227]" />
          <input type="date" value={to} onChange={(e) => setTo(e.target.value)} className="bg-[#0f1513] border border-[#26332e] rounded-md px-2 py-1.5 text-sm text-[#e9e4d8] focus:outline-none focus:border-[#c9a227]" />
        </div>
        <SectionTitle sub="Independent from all other tabs — client visit tracking only">Visit Bill</SectionTitle>
        <EditableTable
          columns={[
            { key: "date", label: "Visit Date", type: "date", minWidth: 150 },
            { key: "client", label: "Client Name", type: "text", minWidth: 190 },
            { key: "branch", label: "Branch Name", type: "text", minWidth: 180 },
            { key: "visitAmount", label: "Visit Amount", type: "number", minWidth: 140 },
            { key: "actualCost", label: "Actual Cost", type: "number", minWidth: 140 },
            { key: "remaining", label: "Remaining", type: "computed", compute: (r) => num(r.visitAmount) - num(r.actualCost), minWidth: 150 },
            { key: "remarks", label: "Remarks / Notes", type: "text", minWidth: 220 },
          ]}
          rows={filtered}
          onChange={(rows) => {
            const map = new Map(rows.map((r) => [r.id, r]));
            setBills(state.visitBills.map((r) => map.get(r.id) || r));
          }}
          onAdd={() => setBills([...state.visitBills, { id: uid(), date: todayISO(), client: "", branch: "", visitAmount: 0, actualCost: 0, remarks: "" }])}
          onDelete={(id) => setBills(state.visitBills.filter((r) => r.id !== id))}
          addLabel="Add visit record"
          totals={{ visitAmount: totalAmount, actualCost: totalActual }}
        />
      </Card>
    </div>
  );
}

const PIE_COLORS = ["#c9a227", "#7fae72", "#4f9a94", "#c0392b", "#8a6fb0", "#d4832f", "#5b7fc9", "#a3785a", "#6b8f4f", "#b0507f"];

function SummaryTab({ state, year, month }) {
  const key = monthKey(year, month);
  const monthData = state.months[key] || emptyMonth();
  const totalAssets = state.assets.reduce((s, a) => s + num(a.amount), 0);
  const totalLiabilities =
    state.liabilities.borrowings.reduce((s, r) => s + num(r.amount), 0) +
    state.liabilities.cards.reduce((s, r) => s + num(r.outstanding), 0) +
    state.liabilities.loans.reduce((s, r) => s + num(r.outstanding), 0) +
    (state.liabilities.custom || []).reduce((s, r) => s + num(r.amount), 0);
  const netPosition = totalAssets - totalLiabilities;
  const posStatus = netPositionStatus(totalAssets, totalLiabilities);

  const cyc = state.handCostCycles[key];
  const cycTotalActual = cyc ? cycleDates(key).reduce((s, d) => s + (cyc.daily[d] ? num(cyc.daily[d].officeActual) + num(cyc.daily[d].handActual) : 0), 0) : 0;
  const expenseAdj = monthData.expense.map((r) => r.head === "Hand Cost" && cyc ? { ...r, actual: cycTotalActual } : r);

  const totalIncome = monthData.income.reduce((s, r) => s + num(r.actual), 0);
  const totalExpense = expenseAdj.reduce((s, r) => s + num(r.actual), 0);
  const totalBudget = monthData.income.reduce((s, r) => s + num(r.budget), 0) + monthData.expense.reduce((s, r) => s + num(r.budget), 0);
  const totalActualAll = totalIncome + totalExpense;
  const surplus = totalIncome - totalExpense;
  const remainingBudget = monthData.expense.reduce((s, r) => s + (num(r.budget) - num(r.actual)), 0);
  const expBudgetTotal = monthData.expense.reduce((s, r) => s + num(r.budget), 0);
  const remStatus = usageStatus(expBudgetTotal, totalExpense);

  const trend = Array.from({ length: 12 }, (_, i) => {
    const k = monthKey(year, i + 1);
    const md = state.months[k];
    const inc = md ? md.income.reduce((s, r) => s + num(r.actual), 0) : 0;
    const exp = md ? md.expense.reduce((s, r) => s + num(r.actual), 0) : 0;
    return { month: MONTH_NAMES[i].slice(0, 3), Income: inc, Expense: exp };
  });

  const expenseBreakdown = expenseAdj.filter((r) => num(r.actual) > 0).map((r) => ({ name: r.head, value: num(r.actual) }));
  const assetDist = state.assets.filter((a) => num(a.amount) > 0).map((a) => ({ name: a.name, value: num(a.amount) }));
  const liabilityDist = [
    { name: "Hand Borrowings", value: state.liabilities.borrowings.reduce((s, r) => s + num(r.amount), 0) },
    { name: "Card Bill", value: state.liabilities.cards.reduce((s, r) => s + num(r.outstanding), 0) },
    { name: "Bank Loan", value: state.liabilities.loans.reduce((s, r) => s + num(r.outstanding), 0) },
    ...(state.liabilities.custom || []).map((c) => ({ name: c.name, value: num(c.amount) })),
  ].filter((r) => r.value > 0);
  const alData = [{ name: "Assets", value: totalAssets }, { name: "Liabilities", value: totalLiabilities }];

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <StatCard label="Total Assets" value={totalAssets} tone="good" />
        <StatCard label="Total Liabilities" value={totalLiabilities} tone="bad" />
        <StatCard label="Net Position" value={netPosition} tone={netPosition >= 0 ? "good" : "bad"} statusColor={posStatus.color} statusLabel={posStatus.label} />
        <StatCard label={`Income · ${MONTH_NAMES[month-1].slice(0,3)} ${year}`} value={totalIncome} tone="good" />
        <StatCard label={`Expense · ${MONTH_NAMES[month-1].slice(0,3)} ${year}`} value={totalExpense} tone="bad" />
        <StatCard label="Surplus / Deficit" value={surplus} tone={surplus >= 0 ? "good" : "bad"} />
        <StatCard label="Total Budget" value={totalBudget} />
        <StatCard label="Total Actual Spending" value={totalActualAll} />
        <StatCard label="Remaining Budget" value={remainingBudget} tone={remainingBudget >= 0 ? "good" : "bad"} statusColor={remStatus.color} statusLabel={remStatus.label} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card className="p-4">
          <SectionTitle sub={`Monthly income vs expense — ${year}`}>Income vs Expense Trend</SectionTitle>
          <div style={{ width: "100%", height: 260 }}>
            <ResponsiveContainer>
              <BarChart data={trend}>
                <CartesianGrid strokeDasharray="3 3" stroke="#26332e" />
                <XAxis dataKey="month" stroke="#7d8f86" fontSize={11} />
                <YAxis stroke="#7d8f86" fontSize={11} />
                <Tooltip contentStyle={{ background: "#161f1c", border: "1px solid #26332e", fontSize: 12 }} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
                <Bar dataKey="Income" fill="#7fae72" radius={[3,3,0,0]} />
                <Bar dataKey="Expense" fill="#c0392b" radius={[3,3,0,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <Card className="p-4">
          <SectionTitle sub={`Surplus / deficit trend — ${year}`}>Monthly Surplus / Deficit</SectionTitle>
          <div style={{ width: "100%", height: 260 }}>
            <ResponsiveContainer>
              <LineChart data={trend.map((t) => ({ month: t.month, Net: t.Income - t.Expense }))}>
                <CartesianGrid strokeDasharray="3 3" stroke="#26332e" />
                <XAxis dataKey="month" stroke="#7d8f86" fontSize={11} />
                <YAxis stroke="#7d8f86" fontSize={11} />
                <Tooltip contentStyle={{ background: "#161f1c", border: "1px solid #26332e", fontSize: 12 }} />
                <Line type="monotone" dataKey="Net" stroke="#c9a227" strokeWidth={2} dot={{ r: 3 }} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <Card className="p-4">
          <SectionTitle sub="Assets vs Liabilities">Financial Position</SectionTitle>
          <div style={{ width: "100%", height: 240 }}>
            <ResponsiveContainer>
              <PieChart>
                <Pie data={alData} dataKey="value" nameKey="name" innerRadius={50} outerRadius={85} paddingAngle={3}>
                  {alData.map((_, i) => <Cell key={i} fill={i === 0 ? "#7fae72" : "#c0392b"} />)}
                </Pie>
                <Tooltip contentStyle={{ background: "#161f1c", border: "1px solid #26332e", fontSize: 12 }} formatter={(v) => fmt(v)} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <Card className="p-4">
          <SectionTitle sub={`${MONTH_NAMES[month-1]} ${year} — actual spend by category`}>Expense Category Breakdown</SectionTitle>
          <div style={{ width: "100%", height: 240 }}>
            <ResponsiveContainer>
              <PieChart>
                <Pie data={expenseBreakdown} dataKey="value" nameKey="name" outerRadius={85} label={false}>
                  {expenseBreakdown.map((_, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                </Pie>
                <Tooltip contentStyle={{ background: "#161f1c", border: "1px solid #26332e", fontSize: 12 }} formatter={(v) => fmt(v)} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <Card className="p-4">
          <SectionTitle sub="Where assets currently sit">Asset Distribution</SectionTitle>
          <div style={{ width: "100%", height: 240 }}>
            <ResponsiveContainer>
              <PieChart>
                <Pie data={assetDist} dataKey="value" nameKey="name" outerRadius={85}>
                  {assetDist.map((_, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                </Pie>
                <Tooltip contentStyle={{ background: "#161f1c", border: "1px solid #26332e", fontSize: 12 }} formatter={(v) => fmt(v)} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <Card className="p-4">
          <SectionTitle sub="Where liabilities currently sit">Liability Distribution</SectionTitle>
          <div style={{ width: "100%", height: 240 }}>
            <ResponsiveContainer>
              <PieChart>
                <Pie data={liabilityDist} dataKey="value" nameKey="name" outerRadius={85}>
                  {liabilityDist.map((_, i) => <Cell key={i} fill={PIE_COLORS[(i+3) % PIE_COLORS.length]} />)}
                </Pie>
                <Tooltip contentStyle={{ background: "#161f1c", border: "1px solid #26332e", fontSize: 12 }} formatter={(v) => fmt(v)} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Export helpers                                                         */
/* ---------------------------------------------------------------------- */
function exportExcel(state, tab, year, month, cycleKey) {
  const wb = XLSX.utils.book_new();
  if (tab === "balance") {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.assets.map(({name,amount}) => ({ Category: name, Amount: amount }))), "Assets");
    const custom = state.liabilities.custom || [];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(custom.map(({name,amount}) => ({ Category: name, Amount: amount }))), "Other Liabilities");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.liabilities.borrowings.map(({person,amount,date,notes}) => ({ Person: person, Amount: amount, Date: date, Notes: notes }))), "Hand Borrowings");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.liabilities.cards.map(({cardName,outstanding,dueDate,notes}) => ({ Card: cardName, Outstanding: outstanding, DueDate: dueDate, Notes: notes }))), "Card Bill");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.liabilities.loans.map(({loanName,bankName,outstanding,emi,interest,dueDate,notes}) => ({ Loan: loanName, Bank: bankName, Outstanding: outstanding, EMI: emi, Interest: interest, DueDate: dueDate, Notes: notes }))), "Bank Loan");
    XLSX.writeFile(wb, "Balance_Sheet.xlsx");
  } else if (tab === "monthly") {
    const key = monthKey(year, month);
    const data = state.months[key] || emptyMonth();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.income.map(({head,budget,actual,notes}) => ({ Head: head, Budget: budget, Actual: actual, Difference: num(actual)-num(budget), Notes: notes }))), "Income");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.expense.map(({head,budget,actual,notes}) => ({ Head: head, Budget: budget, Actual: actual, Remaining: num(budget)-num(actual), Notes: notes }))), "Expense");
    XLSX.writeFile(wb, `Monthly_Budget_${MONTH_NAMES[month-1]}_${year}.xlsx`);
  } else if (tab === "handcost") {
    const dates = cycleDates(cycleKey);
    const cyc = state.handCostCycles[cycleKey] || { daily: {} };
    const rows = dates.map((d) => {
      const e = cyc.daily[d] || { officeBudget:0, handBudget:0, officeActual:0, handActual:0 };
      return { Date: d, OfficeBudget: num(e.officeBudget), HandBudget: num(e.handBudget), OfficeActual: num(e.officeActual), HandActual: num(e.handActual), Remaining: (num(e.officeBudget)+num(e.handBudget))-(num(e.officeActual)+num(e.handActual)) };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Hand Cost");
    XLSX.writeFile(wb, `Hand_Cost_${cycleKey}.xlsx`);
  } else if (tab === "visit") {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.visitBills.map(({date,client,branch,visitAmount,actualCost,remarks}) => ({ Date: date, Client: client, Branch: branch, VisitAmount: visitAmount, ActualCost: actualCost, Remaining: num(visitAmount)-num(actualCost), Remarks: remarks }))), "Visit Bill");
    XLSX.writeFile(wb, "Visit_Bill.xlsx");
  } else if (tab === "summary") {
    const totalAssets = state.assets.reduce((s, a) => s + num(a.amount), 0);
    const totalLiabilities = state.liabilities.borrowings.reduce((s,r)=>s+num(r.amount),0) + state.liabilities.cards.reduce((s,r)=>s+num(r.outstanding),0) + state.liabilities.loans.reduce((s,r)=>s+num(r.outstanding),0) + (state.liabilities.custom||[]).reduce((s,r)=>s+num(r.amount),0);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([
      { Metric: "Total Assets", Value: totalAssets },
      { Metric: "Total Liabilities", Value: totalLiabilities },
      { Metric: "Net Position", Value: totalAssets - totalLiabilities },
    ]), "Summary");
    XLSX.writeFile(wb, "Summary.xlsx");
  }
}

/* ---------------------------------------------------------------------- */
/*  Navigation                                                             */
/* ---------------------------------------------------------------------- */
const TABS = [
  { id: "balance", label: "Balance Sheet", icon: Landmark, accent: "#2563eb" },
  { id: "monthly", label: "Monthly Budget", icon: Receipt, accent: "#7c3aed" },
  { id: "handcost", label: "Hand Cost Budget", icon: Coins, accent: "#d97706" },
  { id: "summary", label: "Summary", icon: PieIcon, accent: "#0891b2" },
  { id: "visit", label: "Visit Bill", icon: CalendarDays, accent: "#db2777" },
];

function NavList({ tab, setTab, collapsed, onNavigate }) {
  return (
    <nav className="flex-1 py-3 px-2.5 flex flex-col gap-1.5 overflow-y-auto">
      {TABS.map((t) => {
        const Icon = t.icon;
        const active = tab === t.id;
        return (
          <button
            key={t.id}
            title={t.label}
            onClick={() => { setTab(t.id); onNavigate && onNavigate(); }}
            className={`group flex items-center gap-3 w-full py-3 rounded-[12px] text-[14.5px] font-medium whitespace-nowrap transition-all duration-150 ${
              collapsed ? "px-0 justify-center" : "px-3.5"
            } ${
              active
                ? "bg-[#e7eafd] text-[#312e81] shadow-[inset_0_0_0_1px_#c7d2fe]"
                : "text-[#475569] hover:bg-[#f1f5fb] hover:text-[#1e293b]"
            }`}
          >
            <span
              className={`flex items-center justify-center w-8 h-8 rounded-[9px] shrink-0 transition-colors ${
                active ? "" : "bg-[#eef1f6] group-hover:bg-white"
              }`}
              style={active ? { backgroundColor: t.accent + "1f" } : {}}
            >
              <Icon size={17} strokeWidth={2.25} style={{ color: active ? t.accent : "#64748b" }} />
            </span>
            {!collapsed && <span className="truncate">{t.label}</span>}
            {!collapsed && active && (
              <span className="ml-auto w-1.5 h-1.5 rounded-full shrink-0" style={{ backgroundColor: t.accent }} />
            )}
          </button>
        );
      })}
    </nav>
  );
}

/* ---------------------------------------------------------------------- */
/*  App shell                                                              */
/* ---------------------------------------------------------------------- */
function App() {
  useLedgerFonts();
  const [state, setState] = useState(defaultState());
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("summary");
  const [navCollapsed, setNavCollapsed] = useState(false);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const [cycleKey, setCycleKey] = useState(() => {
    const d = now.getDate();
    const y = now.getFullYear(); const m = now.getMonth() + 1;
    return d >= 24 ? monthKey(y, m) : monthKey(m === 1 ? y - 1 : y, m === 1 ? 12 : m - 1);
  });
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("finance-app-data");
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setState({ ...defaultState(), ...parsed, liabilities: { ...defaultState().liabilities, ...(parsed.liabilities || {}) } });
        }
      } catch (e) {
        // no existing data yet
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set("finance-app-data", JSON.stringify(state));
      } catch (e) { /* best effort */ }
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [state, loaded]);

  const activeMeta = TABS.find((t) => t.id === tab);

  return (
    <div className="min-h-screen w-full flex bg-[#0f1513] text-[#e9e4d8]" style={{ fontFamily: "'Inter', sans-serif" }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          body { background: white !important; }
        }
        input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }
        textarea { font-family: inherit; }
      `}</style>

      {/* Main content (left) */}
      <main className="flex-1 min-w-0 px-4 py-5 md:px-8 md:py-8 max-w-5xl mx-auto w-full">
        <div className="no-print flex items-center justify-between mb-6 flex-wrap gap-2">
          <div className="flex items-center gap-3">
            <button onClick={() => setMobileNavOpen(true)} className="md:hidden p-2 rounded-md border border-[#26332e] text-[#c8d3ce]">
              <Menu size={18} />
            </button>
            <div>
              <h1 className="font-serif text-2xl md:text-3xl text-[#e9e4d8]" style={{ fontFamily: "'Fraunces', serif" }}>{activeMeta.label}</h1>
              <p className="text-xs text-[#7d8f86] mt-0.5">
                {tab === "visit" ? "Kept completely separate from your budget & balance sheet" : "Figures update automatically across linked tabs"}
              </p>
            </div>
          </div>
          <div className="flex gap-2">
            <GhostBtn onClick={() => exportExcel(state, tab, year, month, cycleKey)}><Download size={14} /> Excel</GhostBtn>
            <GhostBtn onClick={() => window.print()}><Printer size={14} /> PDF</GhostBtn>
          </div>
        </div>

        {!loaded ? (
          <p className="text-sm text-[#7d8f86]">Loading your ledger…</p>
        ) : (
          <>
            {tab === "balance" && <BalanceSheetTab state={state} setState={setState} />}
            {tab === "monthly" && <MonthlyBudgetTab state={state} setState={setState} year={year} month={month} setYear={setYear} setMonth={setMonth} />}
            {tab === "handcost" && <HandCostTab state={state} setState={setState} cycleKey={cycleKey} setCycleKey={setCycleKey} />}
            {tab === "summary" && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-end gap-3">
                  <div>
                    <label className="block text-[11px] uppercase tracking-wider text-[#7d8f86] mb-1">Year</label>
                    <Select value={year} onChange={(e) => setYear(Number(e.target.value))} options={Array.from({length:9},(_,i)=>2023+i).map((y) => ({ value: y, label: y }))} />
                  </div>
                  <div>
                    <label className="block text-[11px] uppercase tracking-wider text-[#7d8f86] mb-1">Month</label>
                    <Select value={month} onChange={(e) => setMonth(Number(e.target.value))} options={MONTH_NAMES.map((m, i) => ({ value: i + 1, label: m }))} />
                  </div>
                </div>
                <SummaryTab state={state} year={year} month={month} />
              </div>
            )}
            {tab === "visit" && <VisitBillTab state={state} setState={setState} />}
          </>
        )}
      </main>

      {/* Desktop right-side nav: collapsible */}
      <aside
        className={`no-print hidden md:flex md:flex-col border-l border-[#e2e8f0] transition-all duration-200 relative z-10 ${navCollapsed ? "w-16" : "w-60"}`}
        style={{ background: "linear-gradient(180deg, #fbfcff 0%, #f4f6fd 100%)" }}
      >
        <div className="flex items-center justify-between px-3.5 py-5 border-b border-[#e2e8f0]">
          {!navCollapsed && (
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: "linear-gradient(135deg, #4f46e5, #6366f1)" }}>
                <span className="font-mono text-xs font-semibold text-white">৳</span>
              </div>
              <div>
                <p className="font-serif text-sm leading-tight text-[#1e293b]" style={{ fontFamily: "'Fraunces', serif" }}>Ledger</p>
                <p className="text-[10px] text-[#64748b] tracking-wide">Personal Finance</p>
              </div>
            </div>
          )}
          {navCollapsed && (
            <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 mx-auto" style={{ background: "linear-gradient(135deg, #4f46e5, #6366f1)" }}>
              <span className="font-mono text-xs font-semibold text-white">৳</span>
            </div>
          )}
        </div>
        <button onClick={() => setNavCollapsed((c) => !c)} title={navCollapsed ? "Expand menu" : "Collapse menu"}
          className="mx-2.5 mt-3 p-1.5 rounded-lg border border-[#e2e8f0] bg-white text-[#64748b] hover:bg-[#f1f5fb] hover:text-[#1e293b] transition-colors shrink-0 flex items-center justify-center self-end">
          {navCollapsed ? <ChevronsLeft size={15} /> : <ChevronsRight size={15} />}
        </button>
        <NavList tab={tab} setTab={setTab} collapsed={navCollapsed} />
      </aside>

      {/* Mobile slide-out nav */}
      {mobileNavOpen && (
        <div className="no-print fixed inset-0 md:hidden" style={{ zIndex: 100 }}>
          {/* Dimmed backdrop */}
          <div
            className="absolute inset-0"
            style={{ backgroundColor: "rgba(15, 23, 42, 0.55)", zIndex: 100 }}
            onClick={() => setMobileNavOpen(false)}
          />
          {/* Solid opaque drawer panel */}
          <aside
            className="absolute right-0 top-0 bottom-0 w-[80vw] max-w-[300px] flex flex-col shadow-2xl"
            style={{ background: "linear-gradient(180deg, #fbfcff 0%, #f4f6fd 100%)", opacity: 1, zIndex: 101 }}
          >
            <div className="flex items-center justify-between px-4 py-4 border-b border-[#e2e8f0] shrink-0">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: "linear-gradient(135deg, #4f46e5, #6366f1)" }}>
                  <span className="font-mono text-xs font-semibold text-white">৳</span>
                </div>
                <p className="font-serif text-sm text-[#1e293b]" style={{ fontFamily: "'Fraunces', serif" }}>Ledger</p>
              </div>
              <button
                onClick={() => setMobileNavOpen(false)}
                aria-label="Close navigation"
                className="p-2.5 rounded-full bg-white border border-[#e2e8f0] text-[#475569] shadow-sm hover:bg-[#f1f5fb] hover:text-[#1e293b] transition-colors shrink-0"
              >
                <X size={19} />
              </button>
            </div>
            <div className="flex-1 overflow-y-auto">
              <NavList tab={tab} setTab={setTab} collapsed={false} onNavigate={() => setMobileNavOpen(false)} />
            </div>
          </aside>
        </div>
      )}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
